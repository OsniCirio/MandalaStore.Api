
name: CI MandalaStore API

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8 e 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restaurar dependencias
        run: dotnet restore MandalaStore.sln

      - name: Compilar em Release
        run: dotnet build MandalaStore.sln --configuration Release --no-restore
